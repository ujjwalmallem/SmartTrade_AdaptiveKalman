name: Research Backtest

# Offline research only: downloads public prices, simulates, uploads a report.
# No secrets, no broker access, no writes to any results branch.
on:
  push:
    branches: ["main-claude", "claude/**"]
    paths:
      - "research/**"
      - "src/**"
      - ".github/workflows/research-backtest.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backtest grid (live AI/tech universe)
        run: python research/backtest_pairs.py --universe live --out research_out/live

      - name: Run backtest grid (classic linked-pairs universe)
        run: python research/backtest_pairs.py --universe classic --out research_out/classic

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-backtest
          path: research_out/
          if-no-files-found: warn
