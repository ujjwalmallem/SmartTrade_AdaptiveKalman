name: Paper Trading CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]
  # Scheduling now lives in the Cloudflare Worker (cloudflare-scheduler/),
  # which calls the GitHub API to dispatch this workflow 6x weekdays across
  # US extended hours. workflow_dispatch is what it calls into.
  workflow_dispatch: {}

jobs:
  run-paper-trading:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile paper_trading_ml_exit.py

      - name: Run paper trading + ML exit trainer
        run: python paper_trading_ml_exit.py

      - name: Retrain from stored results
        run: python paper_trading_ml_exit.py --train-only

      - name: Upload results artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-trading-results
          path: |
            results/paper_trades.csv
            results/exit_training_dataset.csv
            results/logistic_exit_model.json
          if-no-files-found: warn
