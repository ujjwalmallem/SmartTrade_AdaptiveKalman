name: Paper Trading CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]
  schedule:
    # 6 times per day (every 4 hours, UTC)
    - cron: "0 0,4,8,12,16,20 * * *"

jobs:
  run-paper-trading:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile paper_trading_ml_exit.py

      - name: Run paper trading + ML exit trainer
        run: python paper_trading_ml_exit.py
