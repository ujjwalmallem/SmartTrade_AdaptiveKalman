name: Paper Trading CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]
  schedule:
    # 6× weekdays during US regular hours only (9:30–16:00 ET). No pre/post.
    # Times ET: 10:05, 11:05, 12:05, 13:05, 14:05, 15:05. Cron is UTC for EDT (UTC−4).
    # During EST these fire 1 hour later local time. Weekends skipped.
    - cron: "5 14,15,16,17,18,19 * * 1-5"

jobs:
  run-paper-trading:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile paper_trading_ml_exit.py

      - name: Run paper trading + ML exit trainer
        run: python paper_trading_ml_exit.py

      - name: Retrain from stored results
        run: python paper_trading_ml_exit.py --train-only

      - name: Upload results artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-trading-results
          path: |
            results/paper_trades.csv
            results/exit_training_dataset.csv
            results/logistic_exit_model.json
          if-no-files-found: warn
