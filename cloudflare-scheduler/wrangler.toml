name = "smarttrade-paper-trading-scheduler"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Sole scheduler for the paper-trading workflow: 6x weekdays across
# pre/RTH/post US extended hours (UTC). GitHub Actions' own `schedule:`
# trigger has been removed from paper-trading.yml in favor of this.
[triggers]
crons = ["0 8,11,14,17,20,23 * * 1-5"]

[vars]
GITHUB_OWNER = "ujjwalmallem"
GITHUB_REPO = "smarttrade_adaptivekalman"
GITHUB_WORKFLOW_FILE = "paper-trading.yml"
GITHUB_REF = "main"
